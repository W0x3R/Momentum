<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Momentum</title>
	<link rel="apple-touch-icon" sizes="180x180" href="./images/fav-icons/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="./images/fav-icons/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="./images/fav-icons/favicon-16x16.png">
	<link rel="manifest" href="./images/fav-icons/site.webmanifest">
	<link rel="mask-icon" href="./images/fav-icons/safari-pinned-tab.svg" color="#000000">
	<link rel="shortcut icon" href="./images/fav-icons/favicon.ico">
	<meta name="msapplication-TileColor" content="#da532c">
	<meta name="msapplication-config" content="./images/fav-icons/browserconfig.xml">
	<meta name="theme-color" content="#ffffff">
	<link rel="stylesheet" href="./css/style.css">
</head>

<body class="body">
	<div class="wrapper">
		<div class="container">
			<header class="header">
				<div class="player">
					<p class="player__track-name"></p>
					<audio class="player__audio"></audio>
					<div class="player__progress-wrapper">
						<p class="player__current-time"></p>
						<progress class="player__progress" value="0"></progress>
						<p class="player__duration-time"></p>
					</div>
					<div class="player__playback">
						<button class="player__playback-prev">
							<svg viewBox="0 0 64 64">
								<use href='./images/svg/prevSongBtn.svg#prevSong'></use>
							</svg>
						</button>
						<button class="player__playback-play">
							<svg class="player__playback-play-icon" viewBox="0 0 64 64">
								<use href='./images/svg/playSongBtn.svg#playSong'></use>
							</svg>
						</button>
						<button class="player__playback-next">
							<svg viewBox="0 0 64 64">
								<use href='./images/svg/nextSongBtn.svg#nextSong'></use>
							</svg>
						</button>
					</div>
					<div class="player__volume">
						<button class="player__volume-mute">
							<svg viewBox="0 0 42.878 42.878">
								<use></use>
							</svg>
						</button>
						<input class="player__volume-input" type="range" name="volume" min="0" max="1" step="0.1" value="0.7">
					</div>
					<ul class="player__list"></ul>
				</div>
				<div class="settings">
					<div class="settings__header">
						<p class="settings__header-title"></p>
						<button class="settings__header-button">
							<svg viewBox="0 0 32 32">
								<use href='./images/svg/settingsBtn.svg#settingsBtn'></use>
							</svg>
						</button>
					</div>
					<div class="settings__wrapper">
						<button class="settings__close-button">✖</button>
						<div class="language settings__inner">
							<span class="language__description"></span>
							<div class="language__inner">
								<select class="language__select" name="language">
									<option value="en" label=" "></option>
									<option value="ru" label=" "></option>
								</select>
							</div>
						</div>
						<div class="settings__inner">
							<span class="source__description"></span>
							<div class="source">
								<select class="source__select" name="picture-source">
									<option value="github">Github</option>
									<option value="pexels">Pexels</option>
								</select>
								<br>
							</div>
						</div>
						<div class="query settings__inner">
							<label class="query__label" for="query"></label>
							<div class="query__inner">
								<input id="query" class="query__input" type="text" name="query">
							</div>
						</div>
						<div class="settings__blocks-hide">
							<p class="settings__blocks-hide-title"></p>
							<div class="settings__blocks-hide-player settings__blocks-hide-inner" data-blockshide="player">
								<p class="settings__blocks-hide-label"></p>
								<input type="checkbox" name="player">
							</div>
							<div class="settings__blocks-hide-weather settings__blocks-hide-inner" data-blockshide="weather">
								<p class="settings__blocks-hide-label"></p>
								<input type="checkbox" name="weather">
							</div>
							<div class="settings__blocks-hide-time settings__blocks-hide-inner" data-blockshide="data__time">
								<p class="settings__blocks-hide-label"></p>
								<input type="checkbox" name="data__time">
							</div>
							<div class="settings__blocks-hide-date settings__blocks-hide-inner" data-blockshide="data__date">
								<p class="settings__blocks-hide-label"></p>
								<input type="checkbox" name="data__date">
							</div>
							<div class="settings__blocks-hide-greeting settings__blocks-hide-inner" data-blockshide="greeting">
								<p class="settings__blocks-hide-label"></p>
								<input type="checkbox" name="greeting">
							</div>
							<div class="settings__blocks-hide-quotes settings__blocks-hide-inner" data-blockshide="quotes">
								<p class="settings__blocks-hide-label"></p>
								<input type="checkbox" name="quotes">
							</div>
						</div>
					</div>
				</div>
				<div class="weather">
					<input class="weather__input" type="text" name="city">
					<hr class="weather__hr">
					<span class="weather__icon"></span>
					<p class="weather_error"></p>
					<span class="weather__temperature"></span>
					<span class="weather__description"></span>
					<p class="weather__wind"></p>
					<p class="weather__humidity"></p>
				</div>
			</header>
			<main class="main">
				<div class="data">
					<p class="data__time"></p>
					<p class="data__date"></p>
				</div>
				<div class="greeting">
					<span class="greeting__text"></span>
					<span class="greeting__name" contenteditable="true"></span>
					<div class="greeting__popup">
						<div class="greeting__popup-inner">
							<p class="greeting__popup-message"></p>
							<button class="greeting__popup-close-button">✖</button>
						</div>
					</div>
				</div>
				<div class="slider">
					<button class="slider__button slider__button_prev">
						<svg viewBox="0 0 64 64">
							<use href='./images/svg/prevSlideBtn.svg#prevSlide'></use>
						</svg>
					</button>
					<button class="slider__button slider__button_next">
						<svg viewBox="0 0 64 64">
							<use href='./images/svg/nextSlideBtn.svg#nextSlide'></use>
						</svg>
					</button>
					<div class="slider__popup">
						<p class="slider__popup-message"></p>
						<button class="slider__popup-close-button">✖</button>
					</div>
				</div>
				<div class="popup__shadow"></div>
			</main>
			<footer class="footer">
				<div class="quotes">
					<button class="quotes__change-btn">
						<svg viewBox="0 0 64 64">
							<use href='./images/svg/reloadQuoteBtn.svg#reloadQuote'></use>
						</svg>
					</button>
					<p class="quotes__text"></p>
					<p class="quotes__author"></p>
				</div>
			</footer>
		</div>
	</div>
	<script src="./js/index.js"></script>
</body>

</html>
